<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Stonehenge · Solstice Alignment</title>
<style>
:root{--ink:#f2ead9;--dim:#b8ac95;--line:rgba(242,234,217,.14);--amber:#f0b354;--panel:rgba(19,17,13,.68)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html.standalone,html.standalone body{overflow:hidden;background:#0c0b09}
#app{position:relative;height:640px;overflow:hidden;color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0c0b09;user-select:none;-webkit-user-select:none}
html.standalone #app{position:fixed;inset:0;height:auto}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#c.drag{cursor:grabbing}
#panel{position:absolute;left:14px;top:14px;width:278px;max-height:calc(100% - 28px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(14px) saturate(120%);-webkit-backdrop-filter:blur(14px) saturate(120%);box-shadow:0 18px 50px rgba(0,0,0,.45);scrollbar-width:thin}
#panel header{padding:14px 14px 2px}
#panel h1{margin:0;font:500 21px/1 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:.2em;text-transform:uppercase}
#panel header p{margin:5px 0 0;color:var(--dim);font-size:11px;letter-spacing:.04em}
#panel.folded{display:none}
.basic{padding:10px 14px 12px}
.basic .line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.basic .chk{margin-top:0}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:rgba(242,234,217,.05)}
.seg button{flex:1;min-width:0;padding:7px 4px;background:none;border:0;border-left:1px solid var(--line);color:var(--ink);font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button:hover{background:rgba(242,234,217,.12)}
.seg button.on{background:var(--amber);color:#1a1712;font-weight:600}
.seg button:focus-visible,.btn:focus-visible,#advBtn:focus-visible{outline:1px solid var(--amber);outline-offset:-2px}
.btn{padding:6px 12px;background:rgba(242,234,217,.07);border:1px solid var(--line);border-radius:7px;color:var(--ink);font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(242,234,217,.15)}
#advBtn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 14px;background:none;border:0;border-top:1px solid var(--line);color:var(--dim);font:inherit;font-size:11px;letter-spacing:.06em;cursor:pointer;border-radius:0 0 10px 10px}
#advBtn:hover{color:var(--ink);background:rgba(242,234,217,.05)}
#advBtn svg{width:10px;height:10px;transition:transform .2s}
#advBtn[aria-expanded=true]{border-radius:0;color:var(--ink)}
#advBtn[aria-expanded=true] svg{transform:rotate(180deg)}
section{padding:11px 14px 12px;border-top:1px solid var(--line)}
h2{margin:0 0 6px;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
.srow{display:grid;grid-template-columns:62px 1fr 70px;align-items:center;gap:8px;height:26px}
.srow label{color:var(--dim);font-size:12px}
.srow output{font:11.5px ui-monospace,"SF Mono",Consolas,monospace;color:var(--ink);text-align:right;white-space:nowrap}
.srow input[type=range]{margin:0}
section .seg{margin-top:10px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:2px 0 0;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(242,234,217,.3);border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:rgba(242,234,217,.3);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-6px;border-radius:50%;background:var(--amber);border:2px solid #1a1712;box-shadow:0 0 0 1px var(--amber)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--amber);border:2px solid #1a1712;box-shadow:0 0 0 1px var(--amber)}
input[type=range]:focus-visible{outline:1px solid var(--amber);outline-offset:3px;border-radius:4px}
.chk{display:flex;align-items:center;gap:9px;margin-top:9px;cursor:pointer}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk i{flex:none;width:30px;height:16px;border-radius:9px;background:rgba(242,234,217,.2);position:relative;transition:background .2s}
.chk i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--ink);transition:transform .2s}
.chk input:checked+i{background:var(--amber)}
.chk input:checked+i::after{transform:translateX(14px);background:#1a1712}
.chk input:focus-visible+i{outline:1px solid var(--amber);outline-offset:2px}
.note{margin:8px 0 0;color:var(--dim);font-size:11px}
footer{display:flex;justify-content:space-between;padding:8px 14px 10px;border-top:1px solid var(--line);font:11px ui-monospace,"SF Mono",Consolas,monospace;color:var(--dim)}
#rose{position:absolute;right:16px;top:16px;width:92px;height:92px;border-radius:50%;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:none}
#dial{position:absolute;inset:0;border-radius:50%}
#dial b{position:absolute;left:50%;top:50%;width:14px;margin:-7px;text-align:center;font:600 10px/14px system-ui,sans-serif;color:var(--dim)}
#dial b.n{color:#ff8d6b}
#dial .axis{position:absolute;left:50%;top:13px;bottom:13px;width:1px;background:linear-gradient(var(--amber),rgba(240,179,84,.15))}
#dial .sun{position:absolute;left:50%;top:50%;width:0;height:0}
#dial .sun::after{content:"";position:absolute;left:-4px;top:-39px;width:8px;height:8px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px 2px rgba(255,214,120,.8)}
#rose::after{content:"";position:absolute;left:50%;top:-5px;margin-left:-4px;border:4px solid transparent;border-top:6px solid var(--ink)}
#loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0c0b09;transition:opacity .9s;z-index:5}
#loader.done{opacity:0;pointer-events:none}
#loader h3{margin:0;font:500 22px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:.3em;text-transform:uppercase}
#loader p{margin:0;color:var(--dim);font-size:12px;letter-spacing:.06em;max-width:80%;text-align:center}
@media (max-width:640px){
  #panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:56%}
  #rose{right:10px;top:10px;width:76px;height:76px}
  #dial .sun::after{top:-32px}
}
</style>

</head>
<body>
<div id="app">
  <canvas id="c" tabindex="0" aria-label="Stonehenge 3D scene"></canvas>

  <aside id="panel">
    <header><h1>Stonehenge</h1></header>
    <div class="basic">
      <div class="seg" role="group" aria-label="Time of day">
        <button data-sun="rise">Sunrise</button>
        <button data-sun="noon">Midday</button>
        <button data-sun="set">Sunset</button>
      </div>
      <div class="line">
        <label class="chk"><input type="checkbox" id="crowd"><i></i><span>Visitors</span></label>
        <button class="btn" data-view="avenue" title="Back to the Avenue alignment (R)">Reset view</button>
      </div>
    </div>
    <button id="advBtn" aria-expanded="false" aria-controls="adv"><span>Advanced settings</span><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div id="adv" hidden>
      <section>
        <h2>Sun position</h2>
        <div class="srow"><label for="az">Azimuth</label><input type="range" id="az" min="0" max="360" step="0.1"><output id="azOut"></output></div>
        <div class="srow"><label for="el">Elevation</label><input type="range" id="el" min="-4" max="75" step="0.1"><output id="elOut"></output></div>
        <label class="chk"><input type="checkbox" id="lock" checked><i></i><span>Follow the solstice sun path</span></label>
        <p class="note" id="solar"></p>
      </section>
      <section>
        <h2>Scene</h2>
        <div class="srow"><label for="wind">Wind</label><input type="range" id="wind" min="0" max="1" step="0.01" value="0.35"><output id="windOut"></output></div>
        <label class="chk"><input type="checkbox" id="compass"><i></i><span>Compass lines</span></label>
        <div class="seg" role="group" aria-label="Monument state">
          <button class="on" data-state="today">Today</button>
          <button data-state="built">As built</button>
        </div>
      </section>
      <section>
        <h2>Camera</h2>
        <div class="seg" role="group" aria-label="Camera views" style="margin-top:0">
          <button data-view="centre">Centre</button>
          <button data-view="aerial">Aerial</button>
          <button data-view="plan">Plan</button>
        </div>
        <p class="note">Drag to orbit · right-drag to pan · wheel to zoom · double-click to focus · H hides this panel</p>
      </section>
      <footer><span id="fps">– fps</span><span id="blades">– blades</span></footer>
    </div>
  </aside>

  <div id="rose" aria-hidden="true"><div id="dial">
    <b class="n" style="transform:translateY(-36px)">N</b><b style="transform:translateX(36px)">E</b>
    <b style="transform:translateY(36px)">S</b><b style="transform:translateX(-36px)">W</b>
    <div class="axis" id="roseAxis"></div><div class="sun" id="roseSun"></div>
  </div></div>

  <div id="loader"><h3>Stonehenge</h3><p id="loadMsg">Raising the stones…</p></div>
</div>

<script>
if (window.self === window.top) document.documentElement.classList.add('standalone');
setTimeout(function(){ if(!window.__started){ var m=document.getElementById('loadMsg'); if(m) m.textContent='The 3D library did not load. Check the network connection (three.js comes from cdn.jsdelivr.net) and reload.'; } }, 9000);
</script>

<script type="module">

{ const r = mulberry32(20240621), p = Array.from({ length: 256 }, (_, i) => i);

// ───────────────────────────── site constants ─────────────────────────────
const AXIS = 49.9;                       // solstice axis, degrees east of north
const LAT = 51.1789, DECL = 23.44;       // latitude, solar declination at the June solstice
const dirAz = az => [Math.sin(az * DEG), -Math.cos(az * DEG)];   // +X east, −Z north

// ───────────────────────────── procedural textures ─────────────────────────────

const HT_N = 512, HT_SIZE = 640;
const heightTex = (() => {
  const d = new Uint16Array(HT_N * HT_N);

const SP_N = 1024, SP_SIZE = 380;
